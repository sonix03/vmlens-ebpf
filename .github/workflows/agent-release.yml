name: Agent release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on a dry run. No release is created; the publish job only runs for tags."
        required: false
        default: "dryrun"

permissions:
  contents: write

env:
  # A dry run must stamp something other than the branch name. Every Go binary
  # contains the string "main", so verifying the stamp against a branch called
  # main would pass without proving anything.
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-agent:
    # Each arch builds on its own runner. Cross-compiling the eBPF object is not
    # an option: vmlinux.h is dumped from the runner's own kernel BTF, and
    # struct pt_regs differs per architecture, so an arm64 object built against
    # an x86 header would read the wrong registers.
    runs-on: ${{ matrix.runner }}
    # amd64 is the proven path and must always publish. arm64 is additional, so
    # a failure there cannot hold back the release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libbpf-dev linux-tools-common
          sudo apt-get install -y "linux-tools-$(uname -r)" "linux-cloud-tools-$(uname -r)" || true
          sudo apt-get install -y linux-tools-azure linux-cloud-tools-azure || true
          BPFTOOL_PATH="$(find /usr/lib -path '*linux*tools*' -name bpftool -type f -executable 2>/dev/null | sort -Vr | head -n1 || true)"
          if [ -n "$BPFTOOL_PATH" ]; then
            sudo ln -sf "$BPFTOOL_PATH" /usr/local/bin/bpftool
          fi
          hash -r
          command -v bpftool || true
          if command -v bpftool >/dev/null 2>&1 && ! bpftool version; then
            find /usr/lib -path '*linux*tools*' -name bpftool -type f -executable 2>/dev/null || true
          fi
          test -r /sys/kernel/btf/vmlinux || true

      - name: Build precompiled agent artifacts
        run: |
          set -euxo pipefail
          go version
          go env GOVERSION GOPATH GOMODCACHE
          command -v clang-18
          clang-18 --version
          clang-18 -print-targets | grep -E '^[[:space:]]*bpf[[:space:]]' || true
          command -v bpftool || true
          bpftool version || true
          ls -l /usr/include/bpf/bpf_helpers.h agent/ebpf/include/vmlinux_fallback.h
          ls -l /sys/kernel/btf/vmlinux || true
          VERSION="${RELEASE_VERSION}" TARGET_ARCHES="${{ matrix.arch }}" CLANG_BIN=clang-18 bash -x scripts/build-agent-release.sh

      - name: Verify the version stamp landed in the binary
        run: |
          set -eu
          VERSION="${RELEASE_VERSION}"
          BINARY="dist/agent/${VERSION}/vmlens-agent-linux-${{ matrix.arch }}"
          # An agent that cannot report which release it is makes every field
          # report ambiguous, so a missing stamp fails the build rather than
          # shipping quietly.
          strings "${BINARY}" | grep -qF "${VERSION}" \
            || { echo "version stamp ${VERSION} not found in ${BINARY}" >&2; exit 1; }
          echo "version stamp ${VERSION} present in ${BINARY}"

      # The per-arch SHA256SUMS is deliberately not published from here. Each
      # runner only sees its own arch, so two jobs uploading that name would
      # leave the release holding whichever finished last, listing half the
      # assets. The publish job regenerates it over everything instead.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmlens-agent-artifacts-${{ matrix.arch }}
          path: dist/agent/**

  publish:
    needs: build-agent
    # always(): arm64 is allowed to fail, and the amd64 assets must still ship.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Collect every arch that built
        uses: actions/download-artifact@v4
        with:
          pattern: vmlens-agent-artifacts-*
          merge-multiple: true
          path: downloaded

      - name: Stage the assets and regenerate SHA256SUMS over them
        run: |
          set -eu
          # upload-artifact strips the common parent of everything it matched,
          # so whether the version directory survives the round trip depends on
          # how many files were in it. Flatten instead of guessing: the names
          # are unique across both architectures anyway.
          mkdir -p staging
          find downloaded -type f -exec cp -f {} staging/ \;
          cd staging
          ls -l
          test -f vmlens-agent-linux-amd64 \
            || { echo "amd64 agent binary missing; refusing to publish" >&2; exit 1; }
          test -f flow_tracker-linux-amd64.bpf.o \
            || { echo "amd64 eBPF object missing; refusing to publish" >&2; exit 1; }
          test -f install-agent.sh \
            || { echo "installer missing; refusing to publish" >&2; exit 1; }
          # Regenerated here because each build job only ever saw its own arch.
          sha256sum install-agent.sh vmlens-agent-linux-* flow_tracker-linux-*.bpf.o >SHA256SUMS
          cat SHA256SUMS

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/vmlens-agent-linux-*
            staging/flow_tracker-linux-*.bpf.o
            staging/install-agent.sh
            staging/SHA256SUMS
